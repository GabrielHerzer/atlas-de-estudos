<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title} · Atlas de Estudos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b17;color:#edf5eb;font:1rem/1.5 system-ui;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(100%,410px);padding:32px;background:#192720;border:1px solid #435748;border-radius:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}h1{font-size:1.7rem}form,label,nav{display:grid;gap:8px}form,nav{gap:16px}input,button{font:inherit;padding:11px;border-radius:8px}
input{width:100%;background:#101b17;border:1px solid #748778;color:inherit}button{background:#b8e5a5;color:#122017;font-weight:700;border:0;cursor:pointer}
nav{margin-top:20px}a{color:#c1eab1}p:empty{display:none}
</style>
<main><span class="brand"><img src="/simbolo.svg" width="32" height="32" alt="">Atlas de Estudos</span>
<h1>{title}</h1><p role="status">{notice}</p>
<form method="post" action="{action}">{fields}<button>{button}</button></form>
<nav>{links}<a href="/">Voltar ao Atlas</a></nav></main></html>
